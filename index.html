<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장애인 인식 개선 자가진단</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background-color: #f5f7fa; margin: 0; padding: 15px; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; color: #1a252f; margin-bottom: 5px; }
        .sub-title { text-align: center; font-size: 14px; color: #7f8c8d; margin-bottom: 25px; }
        .q-box { margin-bottom: 25px; border-bottom: 1px solid #edf2f7; padding-bottom: 20px; }
        .q-title { font-weight: bold; margin-bottom: 12px; font-size: 15px; color: #2d3748; word-break: keep-all; }
        .option { display: flex; align-items: flex-start; margin: 8px 0; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .option:hover { background-color: #f7fafc; border-color: #cbd5e0; }
        .option input { margin-top: 3px; margin-right: 10px; flex-shrink: 0; }
        button { width: 100%; padding: 16px; background: #3182ce; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #2b6cb0; }
        #result { display: none; margin-top: 30px; padding: 25px 20px; background: #ebf8ff; border: 2px solid #3182ce; border-radius: 12px; text-align: center; }
        #score-display { font-size: 28px; font-weight: bold; color: #2b6cb0; margin: 10px 0; }
        .result-title { font-size: 18px; font-weight: bold; color: #2d3748; }
        .result-desc { font-size: 15px; color: #4a5568; margin-top: 10px; word-break: keep-all; }
    </style>
</head>
<body>

<div class="container">
    <h1>장애인 인식 개선 자가진단</h1>
    <div class="sub-title">성인용 (총 10문항)</div>
    
    <form id="quizForm">
        <div id="questions"></div>
        <button type="button" onclick="calculateScore()">결과 확인하기</button>
    </form>

    <div id="result">
        <div class="result-title">나의 인식 진단 결과</div>
        <div id="score-display">0점</div>
        <div id="result-text" class="result-desc"></div>
    </div>
</div>

<script>
const data = [
    {
        q: "1. 길거리나 대중교통, 카페 등에서 장애인을 만났을 때, 나의 평소 태도나 생각은 어떠한가요?",
        a: [
            { text: "우리 사회의 다양한 이웃 중 한 분이구나 하고 자연스럽게 받아들인다.", score: 3 },
            { text: "특별히 해를 끼치지 않는다면 굳이 신경 쓰지 않으려고 한다.", score: 2 },
            { text: "어떻게 대해야 할지 몰라 나도 모르게 시선을 피하거나 불편해진다.", score: 1 }
        ]
    },
    {
        q: "2. 식당이나 카페, 혹은 공공장소에 '장애인 안내견(조끼를 입은 강아지)'이 들어왔을 때, 올바른 행동은 무엇일까요?",
        a: [
            { text: "눈으로만 예뻐하고, 만지거나 간식을 주지 않으며 일에 집중하도록 둔다.", score: 3 },
            { text: "귀여우니까 허락 없이 쓰다듬거나 사진을 찍어도 괜찮다.", score: 1 },
            { text: "가게 안에 동물이 들어오면 안 된다고 생각해서 쫓아내야 한다고 여긴다.", score: 1 }
        ]
    },
    {
        q: "3. 직장 동료나 모임의 구성원으로 신체적·마음 불편함이 있는 사람이 함께하게 되었을 때, 나의 생각은?",
        a: [
            { text: "서로 도우며 함께 일할 수 있는 방법을 찾고, 편견 없이 동료로 대한다.", score: 3 },
            { text: "일하는 데 방해가 되지 않을까 걱정되지만, 겉으로는 잘 대해주려고 한다.", score: 2 },
            { text: "솔직히 손이 많이 갈 것 같아서 같은 팀이 되거나 함께 일하기가 꺼려진다.", score: 1 }
        ]
    },
    {
        q: "4. 일상 대화나 모임, 혹은 SNS를 하다가 장애인을 비하하거나 낮추어 부르는 표현을 들었을 때 나는 어떻게 하나요?",
        a: [
            { text: "상처가 되는 말과 행동이므로 사용하지 않고, 그런 표현은 잘못되었다고 생각한다.", score: 3 },
            { text: "나쁜 뜻으로 쓴 게 아니니 그냥 웃어넘기거나 크게 신경 쓰지 않는다.", score: 1 },
            { text: "농담이나 비유로 재밌으니까 나도 가끔 자연스럽게 쓴다.", score: 1 }
        ]
    },
    {
        q: "5. 건물 입구의 경사로, 장애인 전용 주차구역, 음성 안내 시설 등을 볼 때 평소 드는 생각은?",
        a: [
            { text: "몸이 불편한 분들이 편하고 안전하게 다닐 수 있도록 꼭 필요한 고마운 시설이다.", score: 3 },
            { text: "일반 사람들은 잘 안 쓰지만, 법으로 정해져 있으니 어쩔 수 없이 만들어둔 공간이다.", score: 2 },
            { text: "자리만 차지하고 공간을 좁게 만드는 불필요한 시설처럼 느껴질 때가 있다.", score: 1 }
        ]
    },
    {
        q: "6. 뉴스나 방송에서 장애인이 '불쌍한 사람'이나 '모든 것을 이겨낸 대단한 사람'으로만 나올 때, 나의 생각은?",
        a: [
            { text: "특별한 영웅이나 불쌍한 사람이 아니라, 우리와 똑같이 존중받아야 할 평범한 이웃으로 본다.", score: 3 },
            { text: "감동적이거나 안타까운 사연이라고 생각하며, 보통 사람들과는 다른 특별한 존재로 느낀다.", score: 2 },
            { text: "별생각 없이 보며, 매체에서 보여주는 모습 그대로 믿는다.", score: 1 }
        ]
    },
    {
        q: "7. 행사나 모임에서 몸이 불편한 사람이 참여하기 힘든 상황을 보았을 때 나는?",
        a: [
            { text: "모두가 함께 즐길 수 있도록 방안을 바꾸거나 자리를 다시 의논해 본다.", score: 3 },
            { text: "어쩔 수 없는 부분이라고 생각하며, 참석할 수 있는 사람들 위주로 진행한다.", score: 1 },
            { text: "관심을 두지 않거나 나와는 상관없는 일로 여긴다.", score: 1 }
        ]
    },
    {
        q: "8. '장애는 불편한 환경이나 주변의 차별적인 시선 때문에 더 힘들어지는 것이다'라는 말에 대해 어떻게 생각하나요?",
        a: [
            { text: "공감한다. 결국 주변 환경과 우리의 인식이 바뀌어야 진정한 공존이 가능하다.", score: 3 },
            { text: "잘 이해는 안 가지만, 사회적으로 조금 더 배려가 필요하다는 뜻으로 생각한다.", score: 2 },
            { text: "장애는 온전히 개인의 문제인데, 왜 주변 탓을 하는지 잘 모르겠다.", score: 1 }
        ]
    },
    {
        q: "9. 길이나 대중교통에서 도움이 필요한 장애인을 만났을 때, 어떻게 행동하는 것이 가장 좋을까요?",
        a: [
            { text: "먼저 정중하게 '도와드릴까요?'라고 물어보고, 상대방이 원할 때만 도와준다.", score: 3 },
            { text: "상대방의 의사와 상관없이 일단 몸을 붙잡거나 짐을 빼앗듯이 들어주며 이끈다.", score: 1 },
            { text: "귀찮거나 괜히 나섰다가 오해받을까 봐 모르는 척 지나친다.", score: 1 }
        ]
    },
    {
        q: "10. 차별 없는 사회를 만들기 위해, 성인인 내가 일상 속에서 실천할 수 있는 가장 중요한 자세는 무엇일까요?",
        a: [
            { text: "편견 없는 따뜻한 시선으로 이웃을 대하고, 내 말과 행동을 항상 돌아본다.", score: 3 },
            { text: "법이나 규칙만 잘 지키면 남에게 피해 줄 일은 없다고 생각한다.", score: 2 },
            { text: "바쁜 살림과 내 일 처리에 집중하느라 이런 문제까지 신경 쓰기는 어렵다.", score: 1 }
        ]
    }
];

const qContainer = document.getElementById('questions');
data.forEach((item, index) => {
    let html = `<div class="q-box"><div class="q-title">${item.q}</div>`;
    item.a.forEach((opt) => {
        html += `
            <label class="option">
                <input type="radio" name="q${index}" value="${opt.score}">
                <span>${opt.text}</span>
            </label>
        `;
    });
    html += `</div>`;
    qContainer.innerHTML += html;
});

function calculateScore() {
    let totalScore = 0;
    let answeredCount = 0;

    data.forEach((_, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected) {
            totalScore += parseInt(selected.value);
            answeredCount++;
        }
    });

    if (answeredCount < data.length) {
        alert("모든 문항에 답변해 주세요!");
        return;
    }

    const resultDiv = document.getElementById('result');
    const scoreDisplay = document.getElementById('score-display');
    const resultText = document.getElementById('result-text');

    scoreDisplay.innerText = `${totalScore}점 / 30점`;

    if (totalScore >= 27) {
        resultText.innerHTML = "🌟 <b>성숙하고 따뜻한 배려왕!</b><br>장애를 너른 시선으로 이해하고 있으며, 일상 속에서 타인을 존중하는 태도가 매우 훌륭합니다.";
    } else if (totalScore >= 20) {
        resultText.innerHTML = "🌱 <b>더불어 사는 삶을 고민하는 어른!</b><br>기본적인 배려와 상식을 가지고 있습니다. 무심코 지나쳤던 편견을 세심하게 바라보면 더 멋진 이웃이 될 수 있습니다.";
    } else {
        resultText.innerHTML = "💡 <b>인식의 전환을 시작해 볼 시간!</b><br>이번 기회를 통해 주변의 사회적 다양성에 대해 따뜻한 관심을 넓혀보는 건 어떨까요?";
    }

    resultDiv.style.display = 'block';
    resultDiv.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
